manifest_version = 2

[component]
name = "sandbox-runc"
version = "0.1.0"
layer = "osbase"
domain = "sandbox"
description = "runc — OCI-compliant namespace/cgroup container runtime (no VMM)"

[install]
modes = ["system"]

[environment]
requires_os = "linux"
requires_arch = ["x86_64", "aarch64"]
requires_kernel = ">=4.5"

[dependencies]
runtime = ["runc"]
shim = ["containerd-shim-runc-v2"]

[scenario_defaults]
scenario = "runc"
isolation_type = "namespace"
shim = "containerd-shim-runc-v2"

[[support_matrix]]
os = "alinux"
os_version = "4"
arch = ["x86_64", "aarch64"]
kernel = ">=6.6"
tier = "p0"

[[support_matrix]]
os = "alinux"
os_version = "3"
arch = ["x86_64"]
kernel = ">=5.10"
tier = "p1"

[[support_matrix]]
os = "ubuntu"
os_version = ["24.04", "26.04"]
arch = ["x86_64", "aarch64"]
kernel = ">=6.5"
tier = "p2"
notes = "broadly supported; runc ships in upstream container toolchains"
