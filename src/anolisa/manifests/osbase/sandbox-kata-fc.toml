manifest_version = 2

[component]
name = "sandbox-kata-fc"
version = "0.1.0"
layer = "osbase"
domain = "sandbox"
description = "Kata Containers with Firecracker VMM (runtime-rs shim)"

[install]
modes = ["system"]

[environment]
requires_os = "linux"
requires_arch = ["x86_64", "aarch64"]
requires_kernel = ">=5.10"

[environment.requires_env]
kvm_available = "true"

[dependencies]
runtime = ["kata-containers", "firecracker"]
shim = ["containerd-shim-kata-v2"]

[scenario_defaults]
scenario = "kata-fc"
vmm = "firecracker"
shim = "containerd-shim-kata-v2"
shim_impl = "runtime-rs"
guest_kernel = "vmlinux-anolisa-6.6"
guest_rootfs = "kata-containers-initrd-anolisa"
isolation_type = "microvm"

[[support_matrix]]
os = "alinux"
os_version = "4"
arch = ["x86_64", "aarch64"]
kernel = ">=6.6"
tier = "p0"

[[support_matrix]]
os = "alinux"
os_version = "3"
arch = ["x86_64"]
kernel = ">=5.10"
tier = "p1"

[[support_matrix]]
os = "ubuntu"
os_version = ["24.04", "26.04"]
arch = ["x86_64"]
kernel = ">=6.5"
tier = "p2"
notes = "best-effort; firecracker available upstream but kata-rs RPMs not packaged for ubuntu"
